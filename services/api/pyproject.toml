[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alignerstudio-api"
version = "0.1.0"
description = "AlignerStudio FastAPI backend (Phase 1 vertical slice)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "python-multipart>=0.0.9",
  "numpy>=1.24",
  "trimesh[easy]>=4.4",
  "manifold3d>=2.3.0",
  "meshlib>=3.1.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
  "ruff>=0.5",
]
ml-seg = [
  "onnxruntime>=1.17",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
src = ["app", "../../domain", "../../engines", "../../adapters"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
